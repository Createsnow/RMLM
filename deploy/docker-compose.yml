# 研发物料管家：应用 + MySQL 8（不需要 Redis）
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置}
      MYSQL_DATABASE: rmlm
      MYSQL_USER: rmlm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+08:00"]
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: rmlm
      DB_USER: rmlm
      DB_PASSWORD: ${MYSQL_PASSWORD}
      RMLM_JWT_SECRET: ${RMLM_JWT_SECRET:?请在 .env 中设置}
      RMLM_ADMIN_USER: ${RMLM_ADMIN_USER:-admin}
      RMLM_ADMIN_PASSWORD: ${RMLM_ADMIN_PASSWORD:?请在 .env 中设置}
      # 密码连续输错锁定（次数 / 分钟）；开单允许超出申请数量的比例（%，0 = 不允许）
      RMLM_OVER_ISSUE_PCT: ${RMLM_OVER_ISSUE_PCT:-0}
      RMLM_PUBLIC_URL: ${RMLM_PUBLIC_URL:-}
      # 金蝶云星空 WebAPI（只读）；容器须能访问金蝶内网地址。不填则物料用 Excel 导入
      K3_SERVER_URL: ${K3_SERVER_URL:-}
      K3_ACCT_ID: ${K3_ACCT_ID:-}
      K3_USERNAME: ${K3_USERNAME:-}
      K3_APP_ID: ${K3_APP_ID:-}
      K3_APP_SECRET: ${K3_APP_SECRET:-}
      K3_LCID: ${K3_LCID:-2052}
      K3_USE_ORG: ${K3_USE_ORG:-100}
      # 研发领料在金蝶其他出库单里的单据类型（名称或编码，逗号分隔）
      K3_LL_BILL_TYPES: ${K3_LL_BILL_TYPES:-研发测试其他出库单,客供领料其他出库单}
      K3_LOGIN_TIMEOUT: ${K3_LOGIN_TIMEOUT:-30}
      K3_QUERY_TIMEOUT: ${K3_QUERY_TIMEOUT:-120}
      K3_VIEW_TIMEOUT: ${K3_VIEW_TIMEOUT:-60}
      K3_PAGE_RETRIES: ${K3_PAGE_RETRIES:-3}
      K3_PAGE_RETRY_SECONDS: ${K3_PAGE_RETRY_SECONDS:-10}
      # 企业微信自建应用
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      WECOM_SECRET: ${WECOM_SECRET:-}
      WECOM_CONTACT_SECRET: ${WECOM_CONTACT_SECRET:-}
      WECOM_ROOT_DEPT: ${WECOM_ROOT_DEPT:-1}
      # 仓储系统（实物条码）；容器须能访问仓储系统地址
      WMS_BASE_URL: ${WMS_BASE_URL:-}
      WMS_TOKEN: ${WMS_TOKEN:-}
      WMS_TIMEOUT: ${WMS_TIMEOUT:-10}
    volumes:
      - photos:/data/photos   # 照片永久保存，请纳入备份
    ports:
      - "8000:8000"

volumes:
  mysql:
  photos:
