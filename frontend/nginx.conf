# 外层还有 HTTPS 反向代理时，沿用它传来的协议；直接访问时用本层的
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/plain application/javascript application/json text/css image/svg+xml;
    # 照片上传（前端压缩前的原图）、Excel 导入（物料、账号、单据、历史台账）
    client_max_body_size 50m;

    # 来源地址（审计日志用）：只信任内网地址上的反向代理（如 DMZ 的 HTTPS 代理）传来的 X-Forwarded-For，
    # 外网直连时客户端自己填的不算数；下面转发给 api 时改写为确认过的真实地址
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # 审计日志记录来源地址
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # 金蝶全量同步、企微通讯录同步、大批量导入耗时较长
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /health/ {
        proxy_pass http://api:8000;
    }

    # web 容器自身的健康检查
    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    # index.html 每次向服务器确认：更新部署后浏览器立即拿到新页面
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 构建产物文件名带哈希，可长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 前端路由（/ledger、/m/scan 等）都回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
